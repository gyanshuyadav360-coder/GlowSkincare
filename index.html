<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowSkincare - Investment App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
      50% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.6); }
    }
    .animate-pulseGlow {
      animation: pulseGlow 2s infinite;
    }
  </style>
</head>
<body class="bg-gray-950 flex justify-center items-center min-h-screen text-gray-100 font-sans">
  <div id="root" class="w-full max-w-md bg-gray-900 shadow-2xl min-h-screen relative overflow-hidden border border-gray-800"></div>

  <script type="text/babel">
    function App() {
      const MY_UPI_ID = "gyanshu@paytm"; 
      const ADMIN_SECRET_PASS = "admin786";

      const [currentUserPhone, setCurrentUserPhone] = React.useState(() => {
        return localStorage.getItem('glow_current_session') || null;
      });

      const [currentTab, setCurrentTab] = React.useState('home');
      const [isAdminMode, setIsAdminMode] = React.useState(false);

      const [phoneInput, setPhoneInput] = React.useState('');
      const [usernameInput, setUsernameInput] = React.useState('');
      const [loginPassInput, setLoginPassInput] = React.useState('');
      const [withdrawPassInput, setWithdrawPassInput] = React.useState('');
      const [inviteInput, setInviteInput] = React.useState('');
      const [isRegistering, setIsRegistering] = React.useState(false);

      const [rechargeAmount, setRechargeAmount] = React.useState('');
      const [utrInput, setUtrInput] = React.useState('');
      const [screenshotImage, setScreenshotImage] = React.useState('');
      const [withdrawAmount, setWithdrawAmount] = React.useState('');
      const [userWithdrawPassInput, setUserWithdrawPassInput] = React.useState('');

      const [bankName, setBankName] = React.useState('');
      const [accNo, setAccNo] = React.useState('');
      const [ifsc, setIfsc] = React.useState('');

      const [spinning, setSpinning] = React.useState(false);
      const [spinResult, setSpinResult] = React.useState(null);

      const [aiMessages, setAiMessages] = React.useState([
        { sender: 'ai', text: 'नमस्ते! 🙏 मैं GlowSkincare का स्मार्ट AI सपोर्ट हूँ। आपको रिचार्ज, विथड्रॉल, या प्लान खरीदने में कोई भी मदद चाहिए तो बेझिझक पूछें!' }
      ]);
      const [chatInput, setChatInput] = React.useState('');

      const getAllUsers = () => JSON.parse(localStorage.getItem('glow_users') || '{}');
      const getPendingRecharges = () => JSON.parse(localStorage.getItem('glow_pending_recharges') || '[]');

      const user = currentUserPhone ? getAllUsers()[currentUserPhone] : null;

      const generateInviteCode = () => {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
      };

      const handleAuth = (e) => {
        e.preventDefault();
        const registeredUsers = getAllUsers();

        if (phoneInput === "admin" && loginPassInput === ADMIN_SECRET_PASS) {
          setIsAdminMode(true);
          return;
        }

        if (isRegistering) {
          if (!phoneInput || !usernameInput || !loginPassInput || !withdrawPassInput) {
            alert('कृपया मोबाइल नंबर, यूजरनेम, लॉगिन पासवर्ड और विथड्रॉल पासवर्ड सभी फ़ील्ड भरें!');
            return;
          }
          if (registeredUsers[phoneInput]) {
            alert('यह नंबर पहले से रजिस्टर्ड है!');
            return;
          }

          let referredByPhone = null;
          if (inviteInput.trim() !== '') {
            let isValidInvite = false;
            for (let ph in registeredUsers) {
              if (registeredUsers[ph].inviteCode === inviteInput.trim()) {
                isValidInvite = true;
                referredByPhone = ph;
                break;
              }
            }
            if (!isValidInvite) {
              alert('अमान्य इनविटेशन कोड!');
              return;
            }
          }

          const newUser = {
            phone: phoneInput,
            username: usernameInput.trim(),
            loginPassword: loginPassInput,
            withdrawPassword: withdrawPassInput,
            inviteCode: generateInviteCode(),
            referredBy: referredByPhone,
            referralMode: 'commission',
            inviteCount: 0,
            rechargeWallet: 0,
            withdrawWallet: 0,
            productIncome: 0,
            vipLevel: 0,
            spinChances: 1,
            bankDetails: null,
            bankLocked: false,
            myPlans: [],
            withdrawHistory: []
          };

          if (referredByPhone && registeredUsers[referredByPhone]) {
            registeredUsers[referredByPhone].inviteCount = (registeredUsers[referredByPhone].inviteCount || 0) + 1;
          }

          registeredUsers[phoneInput] = newUser;
          localStorage.setItem('glow_users', JSON.stringify(registeredUsers));
          localStorage.setItem('glow_current_session', phoneInput);
          setCurrentUserPhone(phoneInput);
          setCurrentTab('home');
          alert('सफलतापूर्वक रजिस्ट्रेशन हो गया!');

        } else {
          if (!phoneInput || !loginPassInput) {
            alert('कृपया मोबाइल नंबर और लॉगिन पासवर्ड दर्ज करें');
            return;
          }
          if (!registeredUsers[phoneInput]) {
            alert('यह मोबाइल नंबर रजिस्टर्ड नहीं है! कृपया पहले रजिस्टर करें।');
            setIsRegistering(true);
            return;
          }
          const existingUser = registeredUsers[phoneInput];
          if (existingUser.loginPassword !== loginPassInput) {
            alert('गलत लॉगिन पासवर्ड!');
            return;
          }
          localStorage.setItem('glow_current_session', phoneInput);
          setCurrentUserPhone(phoneInput);
          setCurrentTab('home');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('glow_current_session');
        setCurrentUserPhone(null);
        setIsAdminMode(false);
      };

      const [, setForceRender] = React.useState(0);
      const triggerRefresh = () => setForceRender(prev => prev + 1);

      const handleBuyPlan = () => {
        const planPrice = 150;
        const currentCount = (user.myPlans || []).filter(p => p.id === 1).length;

        if (currentCount >= 5) {
          alert('अधिकतम 5 प्लान खरीद सकते हैं!');
          return;
        }

        if (user.rechargeWallet < planPrice) {
          alert('रिचार्ज वॉलेट में पर्याप्त बैलेंस नहीं है!');
          setCurrentTab('recharge');
          return;
        }

        const newPlan = {
          purchaseId: Date.now(),
          id: 1,
          name: 'Daily Skincare Starter Plan',
          price: planPrice,
          dailyIncome: 100,
          durationDays: 49,
          purchaseDate: new Date().getTime(),
          claimed: false
        };

        const allUsers = getAllUsers();
        const u = allUsers[currentUserPhone];
        u.rechargeWallet -= planPrice;
        u.spinChances += 1;
        u.myPlans = [...(u.myPlans || []), newPlan];

        allUsers[currentUserPhone] = u;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        triggerRefresh();
        alert('प्लान सफलतापूर्वक खरीद लिया गया है!');
      };

      const handleClaimPlan = (purchaseId) => {
        const plan = (user.myPlans || []).find(p => p.purchaseId === purchaseId);
        if (!plan || plan.claimed) return;

        const daysPassed = (new Date().getTime() - plan.purchaseDate) / (1000 * 60 * 60 * 24);
        if (daysPassed < plan.durationDays) {
          alert('प्लान अभी लॉक है! 49 दिन पूरे होने बाकी हैं।');
          return;
        }

        const totalReturn = plan.dailyIncome * plan.durationDays;
        const allUsers = getAllUsers();
        const u = allUsers[currentUserPhone];
        u.withdrawWallet += totalReturn;
        u.productIncome += totalReturn;
        u.myPlans = u.myPlans.map(p => p.purchaseId === purchaseId ? { ...p, claimed: true } : p);
        allUsers[currentUserPhone] = u;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        triggerRefresh();
        alert(`₹${totalReturn} आपके विथड्रॉल वॉलेट में जोड़ दिए गए हैं!`);
      };

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setScreenshotImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleRechargeSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(rechargeAmount);
        
        if (!amt || amt < 150) {
          alert('न्यूनतम रिचार्ज राशि ₹150 है!');
          return;
        }
        if (!utrInput || utrInput.trim().length < 6) {
          alert('कृपया सही UTR दर्ज करें');
          return;
        }
        if (!screenshotImage) {
          alert('स्क्रीनशॉट अपलोड करना अनिवार्य है!');
          return;
        }

        const pendingList = getPendingRecharges();
        pendingList.push({
          id: Date.now(),
          phone: currentUserPhone,
          username: user.username,
          amount: amt,
          utr: utrInput.trim(),
          screenshot: screenshotImage,
          date: new Date().toLocaleString()
        });
        localStorage.setItem('glow_pending_recharges', JSON.stringify(pendingList));

        setRechargeAmount('');
        setUtrInput('');
        setScreenshotImage('');
        alert('रिचार्ज अनुरोध सफलतापूर्वक दर्ज हो गया है!');
      };

      const handleAdminApprove = (reqId) => {
        const pendingList = getPendingRecharges();
        const req = pendingList.find(r => r.id === reqId);
        if (!req) return;

        const allUsers = getAllUsers();
        if (allUsers[req.phone]) {
          allUsers[req.phone].rechargeWallet += req.amount;
          localStorage.setItem('glow_users', JSON.stringify(allUsers));
        }

        const updatedList = pendingList.filter(r => r.id !== reqId);
        localStorage.setItem('glow_pending_recharges', JSON.stringify(updatedList));
        triggerRefresh();
        alert('रिचार्ज अप्रूव कर दिया गया!');
      };

      const handleWithdrawSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(withdrawAmount);

        if (!user.bankLocked) {
          alert('कृपया पहले बैंक डिटेल्स सेव करें!');
          return;
        }
        if (!userWithdrawPassInput || userWithdrawPassInput !== user.withdrawPassword) {
          alert('गलत विथड्रॉल पासवर्ड!');
          return;
        }
        if (!amt || amt < 200) {
          alert('न्यूनतम विथड्रॉल राशि ₹200 है!');
          return;
        }
        if (amt > user.withdrawWallet) {
          alert('पर्याप्त बैलेंस नहीं है!');
          return;
        }

        const todayStr = new Date().toDateString();
        const history = user.withdrawHistory || [];
        const todayCount = history.filter(item => new Date(item.timestamp).toDateString() === todayStr).length;

        if (todayCount >= 2) {
          alert('दैनिक सीमा समाप्त! दिन में केवल 2 बार विथड्रॉल कर सकते हैं।');
          return;
        }

        const allUsers = getAllUsers();
        const u = allUsers[currentUserPhone];
        u.withdrawWallet -= amt;
        u.withdrawHistory = [...(u.withdrawHistory || []), { amount: amt, timestamp: Date.now() }];
        
        allUsers[currentUserPhone] = u;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        setWithdrawAmount('');
        setUserWithdrawPassInput('');
        triggerRefresh();
        alert('विथड्रॉल अनुरोध सफलतापर्वक दर्ज हो गया है!');
      };

      const handleSaveBank = (e) => {
        e.preventDefault();
        if (!bankName || !accNo || !ifsc) {
          alert('कृपया सभी बैंक विवरण भरें');
          return;
        }
        const allUsers = getAllUsers();
        const u = allUsers[currentUserPhone];
        u.bankDetails = { name: bankName, accountNo: accNo, ifsc: ifsc };
        u.bankLocked = true;
        allUsers[currentUserPhone] = u;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        triggerRefresh();
        alert('बैंक विवरण सेव हो गए हैं!');
      };

      const handleSpinWheel = () => {
        if (user.spinChances <= 0) {
          alert('कोई स्पिन चांस नहीं बचा है!');
          return;
        }

        setSpinning(true);
        setSpinResult(null);

        const allUsers = getAllUsers();
        allUsers[currentUserPhone].spinChances -= 1;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        triggerRefresh();

        setTimeout(() => {
          const rewards = [0, 0, 10, 20, 50, 100];
          const won = rewards[Math.floor(Math.random() * rewards.length)];
          setSpinResult(won);
          setSpinning(false);

          if (won > 0) {
            const uAll = getAllUsers();
            uAll[currentUserPhone].withdrawWallet += won;
            localStorage.setItem('glow_users', JSON.stringify(uAll));
            triggerRefresh();
          }
        }, 2000);
      };

      if (isAdminMode) {
        const pendingRecharges = getPendingRecharges();
        return (
          <div className="min-h-screen bg-gray-950 text-white p-4 font-sans max-w-md mx-auto relative shadow-2xl animate-fadeIn">
            <div className="flex justify-between items-center mb-6 bg-gray-900 p-4 rounded-2xl border border-gray-800">
              <h1 className="text-xl font-bold text-emerald-400">🛡️ Admin Dashboard</h1>
              <button onClick={() => setIsAdminMode(false)} className="bg-emerald-600 px-3 py-1.5 rounded-xl text-xs font-semibold">ऐप पर जाएं</button>
            </div>
            <div className="space-y-4">
              <h3 className="font-bold text-sm text-gray-300">पेंडिंग रिचार्ज ({pendingRecharges.length})</h3>
              {pendingRecharges.map((req) => (
                <div key={req.id} className="bg-gray-900 p-4 rounded-2xl border border-gray-800 space-y-3">
                  <p className="text-xs text-white">यूजर: {req.username} ({req.phone})</p>
                  <p className="text-lg font-bold text-emerald-400">₹{req.amount}</p>
                  <p className="text-xs font-mono text-yellow-400">UTR: {req.utr}</p>
                  <button onClick={() => handleAdminApprove(req.id)} className="bg-emerald-600 px-4 py-2 rounded-xl text-xs font-bold w-full">Approve</button>
                </div>
              ))}
            </div>
            <button onClick={handleLogout} className="w-full mt-8 py-3 bg-red-600/20 text-red-400 rounded-xl text-xs">लॉग आउट</button>
          </div>
        );
      }

      if (!currentUserPhone || !user) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col justify-center items-center p-4 text-gray-100 animate-fadeIn">
            <div className="max-w-md w-full bg-gray-900 rounded-3xl shadow-2xl p-8 border border-gray-800">
              <div className="text-center mb-8">
                <h1 className="text-3xl font-black text-emerald-400">✨ GlowSkincare ✨</h1>
              </div>
              <div className="flex bg-gray-950 p-1 rounded-2xl mb-6 border border-gray-800">
                <button onClick={() => setIsRegistering(false)} className={`flex-1 py-2.5 text-xs font-semibold rounded-xl ${!isRegistering ? 'bg-emerald-600 text-white' : 'text-gray-400'}`}>लॉगिन</button>
                <button onClick={() => setIsRegistering(true)} className={`flex-1 py-2.5 text-xs font-semibold rounded-xl ${isRegistering ? 'bg-emerald-600 text-white' : 'text-gray-400'}`}>रजिस्टर</button>
              </div>
              <form onSubmit={handleAuth} className="space-y-3">
                <input type="text" placeholder="मोबाइल नंबर" value={phoneInput} onChange={(e) => setPhoneInput(e.target.value)} required className="w-full px-4 py-2.5 rounded-2xl bg-gray-950 border border-gray-800 text-xs text-white" />
                {isRegistering && (
                  <>
                    <input type="text" placeholder="यूजरनेम" value={usernameInput} onChange={(e) => setUsernameInput(e.target.value)} required className="w-full px-4 py-2.5 rounded-2xl bg-gray-950 border border-gray-800 text-xs text-white" />
                    <input type="password" placeholder="विथड्रॉल पासवर्ड (अलग)" value={withdrawPassInput} onChange={(e) => setWithdrawPassInput(e.target.value)} required className="w-full px-4 py-2.5 rounded-2xl bg-gray-950 border border-gray-800 text-xs text-white" />
                    <input type="text" placeholder="इनविटेशन कोड (वैकल्पिक)" value={inviteInput} onChange={(e) => setInviteInput(e.target.value)} className="w-full px-4 py-2.5 rounded-2xl bg-gray-950 border border-gray-800 text-xs text-white" />
                  </>
                )}
                <input type="password" placeholder="लॉगिन पासवर्ड" value={loginPassInput} onChange={(e) => setLoginPassInput(e.target.value)} required className="w-full px-4 py-2.5 rounded-2xl bg-gray-950 border border-gray-800 text-xs text-white" />
                <button type="submit" className="w-full py-3.5 bg-emerald-600 text-white font-bold rounded-2xl text-xs">{isRegistering ? 'रजिस्टर करें' : 'लॉगिन करें'}</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-950 pb-24 font-sans max-w-md mx-auto relative shadow-2xl overflow-hidden text-gray-100 border-x border-gray-900 animate-fadeIn">
          {currentTab === 'home' && (
            <div>
              <div className="bg-gradient-to-b from-emerald-950 via-gray-900 to-gray-950 p-5 border-b border-gray-800">
                <div className="flex justify-between items-center mb-4">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center font-black text-black text-base">
                      {user.username.slice(0, 2).toUpperCase()}
                    </div>
                    <div>
                      <h4 className="font-bold text-sm text-white">{user.username}</h4>
                      <p className="text-[10px] text-emerald-400">ID {user.phone.slice(-6)}</p>
                    </div>
                  </div>
                  <button onClick={() => setCurrentTab('profile')} className="w-9 h-9 rounded-xl bg-gray-900 border border-gray-800 flex items-center justify-center">⚙️</button>
                </div>
                <div className="grid grid-cols-3 gap-2 bg-gray-900/80 p-3 rounded-2xl border border-gray-800 text-center">
                  <div><h4 className="text-sm font-black text-emerald-400">₹{(user.productIncome || 0).toFixed(2)}</h4><p className="text-[10px] text-gray-400">Income</p></div>
                  <div className="border-x border-gray-800"><h4 className="text-sm font-black text-emerald-400">₹{user.rechargeWallet.toFixed(2)}</h4><p className="text-[10px] text-gray-400">Recharge</p></div>
                  <div><h4 className="text-sm font-black text-emerald-400">₹{user.withdrawWallet.toFixed(2)}</h4><p className="text-[10px] text-gray-400">Withdraw</p></div>
                </div>
              </div>
              <div className="p-4 space-y-4">
                <div className="grid grid-cols-4 gap-2 text-center">
                  <button onClick={() => setCurrentTab('recharge')} className="bg-gray-900 p-3 rounded-2xl border border-gray-800 flex flex-col items-center"><span className="text-xl mb-1">💳</span><span className="text-xs text-gray-200">Recharge</span></button>
                  <button onClick={() => setCurrentTab('withdraw')} className="bg-gray-900 p-3 rounded-2xl border border-gray-800 flex flex-col items-center"><span className="text-xl mb-1">🏦</span><span className="text-xs text-gray-200">Withdraw</span></button>
                  <button onClick={() => setCurrentTab('myPlans')} className="bg-gray-900 p-3 rounded-2xl border border-gray-800 flex flex-col items-center"><span className="text-xl mb-1">📄</span><span className="text-xs text-gray-200">Orders</span></button>
                  <button onClick={() => setCurrentTab('profile')} className="bg-gray-900 p-3 rounded-2xl border border-gray-800 flex flex-col items-center"><span className="text-xl mb-1">📱</span><span className="text-xs text-gray-200">Cards</span></button>
                </div>
                <div onClick={() => setCurrentTab('spin')} className="bg-gradient-to-r from-amber-600 to-orange-600 rounded-2xl p-4 shadow-lg cursor-pointer flex justify-between items-center text-white animate-pulseGlow">
                  <div className="flex items-center gap-3"><span className="text-2xl bg-white/20 p-2 rounded-xl">🎁</span><div><h3 className="font-bold text-sm">Lucky Wheel</h3><p className="text-[11px]">Spin to win</p></div></div>
                </div>
              </div>
            </div>
          )}

          {currentTab === 'invest' && (
            <div className="p-4 space-y-4 animate-fadeIn">
              <h3 className="font-bold text-gray-200 text-sm">इन्वेस्टमेंट प्लान</h3>
              <div className="bg-gray-900 rounded-2xl p-4 border border-gray-800">
                <h4 className="font-bold text-emerald-400 text-sm mb-1">Daily Skincare Starter Plan</h4>
                <p className="text-xs text-gray-300">मूल्य: ₹150 | दैनिक: ₹100 | अवधि: 49 दिन</p>
                <button onClick={handleBuyPlan} className="w-full mt-3 py-2.5 rounded-xl text-white font-semibold text-xs bg-emerald-600">प्लान खरीदें (₹150)</button>
              </div>
            </div>
          )}

          {currentTab === 'profile' && (
            <div className="p-4 space-y-4 animate-fadeIn">
              <div className="bg-gray-900 p-4 rounded-2xl border border-gray-800 flex items-center space-x-3">
                <div className="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center font-bold">{user.username.slice(0, 2).toUpperCase()}</div>
                <div><h4 className="font-bold text-sm text-white">{user.username}</h4><p className="text-[11px] text-gray-400">{user.phone}</p></div>
              </div>
              <div className="bg-gray-900 p-4 rounded-2xl border border-gray-800 space-y-3">
                <h4 className="font-bold text-xs text-white">बैंक विवरण</h4>
                {user.bankLocked ? (
                  <div className="text-xs text-emerald-300"><p>{user.bankDetails.name}</p><p>{user.bankDetails.accountNo}</p></div>
                ) : (
                  <form onSubmit={handleSaveBank} className="space-y-2">
                    <input type="text" placeholder="धारक का नाम" value={bankName} onChange={(e) => setBankName(e.target.value)} className="w-full p-2 bg-gray-950 border border-gray-800 rounded-xl text-xs text-white" />
                    <input type="text" placeholder="अकाउंट नंबर" value={accNo} onChange={(e) => setAccNo(e.target.value)} className="w-full p-2 bg-gray-950 border border-gray-800 rounded-xl text-xs text-white" />
                    <input type="text" placeholder="IFSC कोड" value={ifsc} onChange={(e) => setIfsc(e.target.value)} className="w-full p-2 bg-gray-950 border border-gray-800 rounded-xl text-xs text-white" />
                    <button type="submit" className="w-full py-2 bg-emerald-600 rounded-xl text-xs font-semibold">सेव करें</button>
                  </form>
                )}
              </div>
              <button onClick={handleLogout} className="w-full py-3 bg-red-600/20 text-red-400 rounded-2xl text-xs font-semibold">लॉग आउट</button>
            </div>
          )}

          {currentTab === 'recharge' && (
            <div className="p-4 space-y-4 animate-fadeIn">
              <div className="bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-3">
                <h3 className="font-bold text-sm text-white">रिचार्ज (न्यूनतम ₹150)</h3>
                <p className="text-[10px] text-gray-400">UPI ID: {MY_UPI_ID}</p>
                <form onSubmit={handleRechargeSubmit} className="space-y-3">
                  <input type="number" min="150" placeholder="राशि (₹150 या अधिक)" value={rechargeAmount} onChange={(e) => setRechargeAmount(e.target.value)} required className="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-xs text-white" />
                  <input type="text" placeholder="12 अंकों की UTR आईडी" value={utrInput} onChange={(e) => setUtrInput(e.target.value)} required className="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-xs text-white" />
                  <input type="file" accept="image/*" onChange={handleImageChange} required className="w-full text-xs text-gray-400" />
                  <button type="submit" className="w-full py-3 bg-emerald-600 rounded-xl text-xs font-semibold">रिचार्ज भेजें</button>
                </form>
              </div>
            </div>
          )}

          {currentTab === 'withdraw' && (
            <div className="p-4 space-y-4 animate-fadeIn">
              <div className="bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-3">
                <h3 className="font-bold text-sm text-white">विथड्रॉल (न्यूनतम ₹200)</h3>
                <p className="text-[11px] text-gray-400">बैलेंस: ₹{user.withdrawWallet.toFixed(2)} (दिन में 2 बार)</p>
                <form onSubmit={handleWithdrawSubmit} className="space-y-3">
                  <input type="number" min="200" placeholder="राशि" value={withdrawAmount} onChange={(e) => setWithdrawAmount(e.target.value)} required className="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-xs text-white" />
                  <input type="password" placeholder="विथड्रॉल पासवर्ड" value={userWithdrawPassInput} onChange={(e) => setUserWithdrawPassInput(e.target.value)} required className="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-xs text-white" />
                  <button type="submit" className="w-full py-3 bg-emerald-600 rounded-xl text-xs font-semibold">बैंक में भेजें</button>
                </form>
              </div>
            </div>
          )}

          {currentTab === 'myPlans' && (
            <div className="p-4 space-y-4 animate-fadeIn">
              <h3 className="font-bold text-gray-200 text-sm">मेरे ऑर्डर्स</h3>
              {(!user.myPlans || user.myPlans.length === 0) ? <p className="text-gray-500 text-xs">कोई प्लान नहीं है।</p> : user.myPlans.map(p => (
                <div key={p.purchaseId} className="bg-gray-900 p-4 rounded-2xl border border-gray-800 text-xs">
                  <p className="font-bold">{p.name}</p>
                  <button onClick={() => handleClaimPlan(p.purchaseId)} className="mt-2 w-full py-2 bg-emerald-600 rounded-xl">क्लेम करें</button>
                </div>
              ))}
            </div>
          )}

          {currentTab === 'spin' && (
            <div className="p-4 animate-fadeIn text-center">
              <div className="bg-gray-900 rounded-2xl p-6 border border-gray-800 space-y-3">
                <h3 className="font-bold text-base text-white">🎡 लकी स्पिन</h3>
                <p className="text-xs text-gray-400">चांस बचे हैं: {user.spinChances}</p>
                <div className={`w-32 h-32 mx-auto rounded-full border-4 border-emerald-500 flex items-center justify-center bg-gray-950 text-xl ${spinning ? 'animate-spin' : ''}`}>🎯</div>
                {spinResult !== null && <p className="text-emerald-400 text-xs">इनाम: ₹{spinResult}</p>}
                <button onClick={handleSpinWheel} disabled={spinning} className="w-full py-3 bg-emerald-600 rounded-xl text-xs font-semibold">स्पिन घुमाएं</button>
              </div>
            </div>
          )}

          <div className="absolute bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 flex justify-around py-2.5 z-20">
            <button onClick={() => setCurrentTab('home')} className={`flex flex-col items-center ${currentTab === 'home' ? 'text-emerald-400' : 'text-gray-400'} text-[10px]`}>🏠<span>Home</span></button>
            <button onClick={() => setCurrentTab('invest')} className={`flex flex-col items-center ${currentTab === 'invest' ? 'text-emerald-400' : 'text-gray-400'} text-[10px]`}>💎<span>Invest</span></button>
            <button onClick={() => setCurrentTab('profile')} className={`flex flex-col items-center ${currentTab === 'profile' ? 'text-emerald-400' : 'text-gray-400'} text-[10px]`}>👤<span>Account</span></button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
