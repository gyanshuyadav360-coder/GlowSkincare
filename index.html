<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowSkincare - Investment App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div id="root" class="w-full max-w-md bg-white shadow-2xl min-h-screen relative overflow-hidden"></div>

  <script type="text/babel">
    function App() {
      // ⚠️ आपकी गुप्त UPI ID
      const MY_UPI_ID = "gyanshu@paytm"; 
      // 🔐 गुप्त एडमिन पासवर्ड
      const ADMIN_SECRET_PASS = "admin786";

      // Persistent Session: पेज रीफ्रेश होने पर भी लॉगिन बनाए रखना
      const [currentUserPhone, setCurrentUserPhone] = React.useState(() => {
        return localStorage.getItem('glow_current_session') || null;
      });

      const [currentTab, setCurrentTab] = React.useState('home');
      const [isAdminMode, setIsAdminMode] = React.useState(false);

      const [phoneInput, setPhoneInput] = React.useState('');
      const [passInput, setPassInput] = React.useState('');
      const [inviteInput, setInviteInput] = React.useState('');
      const [isRegistering, setIsRegistering] = React.useState(false);

      // Register OTP States
      const [otpSent, setOtpSent] = React.useState(false);
      const [otpInput, setOtpInput] = React.useState('');
      const [generatedOtp, setGeneratedOtp] = React.useState('');

      const [rechargeAmount, setRechargeAmount] = React.useState('');
      const [utrInput, setUtrInput] = React.useState('');
      const [screenshotImage, setScreenshotImage] = React.useState('');
      const [withdrawAmount, setWithdrawAmount] = React.useState('');

      const [bankName, setBankName] = React.useState('');
      const [accNo, setAccNo] = React.useState('');
      const [ifsc, setIfsc] = React.useState('');

      const [spinning, setSpinning] = React.useState(false);
      const [spinResult, setSpinResult] = React.useState(null);

      // AI Chatbot States
      const [aiMessages, setAiMessages] = React.useState([
        { sender: 'ai', text: 'नमस्ते! GlowSkincare सपोर्ट में आपका स्वागत है। मैं आपकी क्या मदद कर सकता हूँ?' }
      ]);
      const [chatInput, setChatInput] = React.useState('');

      // यूज़र डेटा फेच करना
      const getAllUsers = () => JSON.parse(localStorage.getItem('glow_users') || '{}');
      const getPendingRecharges = () => JSON.parse(localStorage.getItem('glow_pending_recharges') || '[]');

      const user = currentUserPhone ? getAllUsers()[currentUserPhone] : null;

      const generateInviteCode = () => {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
      };

      const handleSendOtp = () => {
        if (!phoneInput || phoneInput.length < 10) {
          alert('कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें');
          return;
        }

        const registeredUsers = getAllUsers();
        if (registeredUsers[phoneInput]) {
          alert('यह मोबाइल नंबर पहले से रजिस्टर्ड है! कृपया सीधे लॉगिन करें।');
          setIsRegistering(false);
          return;
        }

        const randomOtp = Math.floor(1000 + Math.random() * 9000).toString();
        setGeneratedOtp(randomOtp);
        setOtpSent(true);
        alert(`[SMS OTP] आपका रजिस्ट्रेशन OTP है: ${randomOtp}`);
      };

      const handleAuth = (e) => {
        e.preventDefault();
        const registeredUsers = getAllUsers();

        // 👑 गुप्त एडमिन लॉगिन चेक
        if (phoneInput === "admin" && passInput === ADMIN_SECRET_PASS) {
          setIsAdminMode(true);
          return;
        }

        if (isRegistering) {
          if (!phoneInput || !passInput || !otpInput) {
            alert('कृपया सभी फ़ील्ड और OTP भरें');
            return;
          }
          if (otpInput !== generatedOtp) {
            alert('गलत OTP! कृपया सही OTP दर्ज करें।');
            return;
          }
          if (registeredUsers[phoneInput]) {
            alert('यह नंबर पहले से रजिस्टर्ड है!');
            return;
          }

          let referredByPhone = null;
          if (inviteInput.trim() !== '') {
            let isValidInvite = false;
            for (let ph in registeredUsers) {
              if (registeredUsers[ph].inviteCode === inviteInput.trim()) {
                isValidInvite = true;
                referredByPhone = ph; // किस यूज़र ने रेफर किया है उसका नंबर सेव करें
                break;
              }
            }
            if (!isValidInvite) {
              alert('अमान्य (Invalid) इनविटेशन कोड! कृपया सही कोड दर्ज करें या इसे खाली छोड़ दें।');
              return;
            }
          }

          const newUser = {
            phone: phoneInput,
            password: passInput,
            inviteCode: generateInviteCode(),
            referredBy: referredByPhone, // रेफरर रिकॉर्ड
            rechargeWallet: 0,
            withdrawWallet: 0,
            vipLevel: 0,
            spinChances: 1,
            bankDetails: null,
            bankLocked: false,
            myPlans: []
          };

          registeredUsers[phoneInput] = newUser;
          localStorage.setItem('glow_users', JSON.stringify(registeredUsers));
          
          localStorage.setItem('glow_current_session', phoneInput);
          setCurrentUserPhone(phoneInput);
          setCurrentTab('home');
          alert('सफलतापूर्वक रजिस्ट्रेशन हो गया!');

        } else {
          if (!phoneInput || !passInput) {
            alert('कृपया मोबाइल नंबर और पासवर्ड दर्ज करें');
            return;
          }

          if (!registeredUsers[phoneInput]) {
            alert('यह मोबाइल नंबर रजिस्टर्ड नहीं है! कृपया पहले रजिस्टर करें।');
            setIsRegistering(true);
            return;
          }

          const existingUser = registeredUsers[phoneInput];
          if (existingUser.password !== passInput) {
            alert('गलत पासवर्ड! कृपया सही पासवर्ड डालें।');
            return;
          }

          localStorage.setItem('glow_current_session', phoneInput);
          setCurrentUserPhone(phoneInput);
          setCurrentTab('home');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('glow_current_session');
        setCurrentUserPhone(null);
        setIsAdminMode(false);
      };

      const [, setForceRender] = React.useState(0);
      const triggerRefresh = () => setForceRender(prev => prev + 1);

      // Plan Purchase & 10% Referral Commission System
      const handleBuyPlan = () => {
        const planPrice = 150;
        const currentCount = (user.myPlans || []).filter(p => p.id === 1).length;

        if (currentCount >= 5) {
          alert('खरीद सीमा पूरी हो गई! अधिकतम 5 प्लान खरीद सकते हैं।');
          return;
        }

        if (user.rechargeWallet < planPrice) {
          alert('रिचार्ज वॉलेट में पर्याप्त बैलेंस नहीं है! कृपया पहले रिचार्ज करें।');
          setCurrentTab('recharge');
          return;
        }

        const newPlan = {
          purchaseId: Date.now(),
          id: 1,
          name: 'Daily Skincare Starter Plan',
          price: planPrice,
          dailyIncome: 100,
          durationDays: 49,
          purchaseDate: new Date().getTime(),
          claimed: false
        };

        const allUsers = getAllUsers();
        const u = allUsers[currentUserPhone];
        u.rechargeWallet -= planPrice;
        u.spinChances += 1;
        u.myPlans = [...(u.myPlans || []), newPlan];

        // 10% Referral Commission Logic
        if (u.referredBy && allUsers[u.referredBy]) {
          const commission = planPrice * 0.10; // 10% of 150 = ₹15
          allUsers[u.referredBy].withdrawWallet += commission;
        }

        allUsers[currentUserPhone] = u;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        triggerRefresh();

        alert('प्लान सफलतापूर्वक खरीद लिया गया है! (रेफरर को 10% कमीशन भेज दिया गया है)');
      };

      const handleClaimPlan = (purchaseId) => {
        const plan = (user.myPlans || []).find(p => p.purchaseId === purchaseId);
        if (!plan || plan.claimed) return;

        const daysPassed = (new Date().getTime() - plan.purchaseDate) / (1000 * 60 * 60 * 24);
        if (daysPassed < plan.durationDays) {
          alert('प्लान अभी लॉक है! 49 दिन अभी पूरे नहीं हुए हैं।');
          return;
        }

        const totalReturn = plan.dailyIncome * plan.durationDays;

        const allUsers = getAllUsers();
        const u = allUsers[currentUserPhone];
        u.withdrawWallet += totalReturn;
        u.myPlans = u.myPlans.map(p => p.purchaseId === purchaseId ? { ...p, claimed: true } : p);
        allUsers[currentUserPhone] = u;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        triggerRefresh();

        alert(`बधाई हो! ₹${totalReturn} आपके विथड्रॉल वॉलेट में जोड़ दिए गए हैं।`);
      };

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setScreenshotImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleRechargeSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(rechargeAmount);
        
        if (!amt || amt <= 0) {
          alert('कृपया सही राशि दर्ज करें');
          return;
        }
        if (!utrInput || utrInput.trim().length < 6) {
          alert('कृपया 12 अंकों की सही UTR / Transaction ID दर्ज करें');
          return;
        }
        if (!screenshotImage) {
          alert('कृपया भुगतान का स्क्रीनशॉट (फोटो) अपलोड करना अनिवार्य है!');
          return;
        }

        const upiLink = `upi://pay?pa=${MY_UPI_ID}&pn=GlowSkincare&am=${amt}&cu=INR`;
        window.location.href = upiLink;

        const pendingList = getPendingRecharges();
        const newReq = {
          id: Date.now(),
          phone: currentUserPhone,
          amount: amt,
          utr: utrInput.trim(),
          screenshot: screenshotImage,
          date: new Date().toLocaleString(),
          status: 'Pending'
        };
        pendingList.push(newReq);
        localStorage.setItem('glow_pending_recharges', JSON.stringify(pendingList));

        setRechargeAmount('');
        setUtrInput('');
        setScreenshotImage('');
        alert(`रिचार्ज अनुरोध सफलतापूर्वक दर्ज हो गया है!\nनोट: रात 12 बजे तक आपके वॉलेट में राशि जोड़ी जाएगी।`);
      };

      const handleAdminApprove = (reqId) => {
        const pendingList = getPendingRecharges();
        const req = pendingList.find(r => r.id === reqId);
        if (!req) return;

        const allUsers = getAllUsers();
        if (allUsers[req.phone]) {
          allUsers[req.phone].rechargeWallet += req.amount;
          localStorage.setItem('glow_users', JSON.stringify(allUsers));
        }

        const updatedList = pendingList.filter(r => r.id !== reqId);
        localStorage.setItem('glow_pending_recharges', JSON.stringify(updatedList));
        triggerRefresh();
        alert(`यूज़र ${req.phone} (UTR: ${req.utr}) का ₹${req.amount} का रिचार्ज सफलतापूर्वक अप्रूव कर दिया गया है!`);
      };

      const handleWithdrawSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(withdrawAmount);

        if (!user.bankLocked) {
          alert('कृपया पैसे निकालने से पहले अपनी बैंक डिटेल्स सेव करें!');
          return;
        }

        if (!amt || amt <= 0) {
          alert('कृपया सही विथड्रॉल राशि दर्ज करें');
          return;
        }

        if (amt > user.withdrawWallet) {
          alert('विथड्रॉल वॉलेट में पर्याप्त बैलेंस नहीं है!');
          return;
        }

        const allUsers = getAllUsers();
        const u = allUsers[currentUserPhone];
        u.withdrawWallet -= amt;
        allUsers[currentUserPhone] = u;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        setWithdrawAmount('');
        triggerRefresh();
        alert(`₹${amt} का विथड्रॉल अनुरोध सफलतापूर्वक दर्ज हो गया है!`);
      };

      const handleSaveBank = (e) => {
        e.preventDefault();
        if (!bankName || !accNo || !ifsc) {
          alert('कृपया सभी बैंक विवरण भरें');
          return;
        }

        const allUsers = getAllUsers();
        const u = allUsers[currentUserPhone];
        u.bankDetails = { name: bankName, accountNo: accNo, ifsc: ifsc };
        u.bankLocked = true;
        allUsers[currentUserPhone] = u;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        triggerRefresh();
        alert('बैंक विवरण सुरक्षित रूप से सेव और लॉक कर दिए गए हैं!');
      };

      const handleBuyVip = (level, price) => {
        if (user.vipLevel !== level - 1) {
          alert(`पहले VIP ${level - 1} खरीदना अनिवार्य है!`);
          return;
        }

        if (user.rechargeWallet < price) {
          alert('VIP अपग्रेड करने के लिए रिचार्ज वॉलेट में पर्याप्त बैलेंस नहीं है!');
          setCurrentTab('recharge');
          return;
        }

        const allUsers = getAllUsers();
        const u = allUsers[currentUserPhone];
        u.rechargeWallet -= price;
        u.vipLevel = level;
        allUsers[currentUserPhone] = u;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        triggerRefresh();
        alert(`बधाई हो! अब आप VIP ${level} के सदस्य बन गए हैं।`);
      };

      const handleSpinWheel = () => {
        if (user.spinChances <= 0) {
          alert('कोई स्पिन चांस नहीं बचा है!');
          return;
        }

        setSpinning(true);
        const allUsers = getAllUsers();
        allUsers[currentUserPhone].spinChances -= 1;
        localStorage.setItem('glow_users', JSON.stringify(allUsers));
        triggerRefresh();

        setTimeout(() => {
          const rewards = [10, 20, 50, 100, 0, 200, 50];
          const randomReward = rewards[Math.floor(Math.random() * rewards.length)];
          setSpinResult(randomReward);
          setSpinning(false);

          if (randomReward > 0) {
            const uAll = getAllUsers();
            uAll[currentUserPhone].withdrawWallet += randomReward;
            localStorage.setItem('glow_users', JSON.stringify(uAll));
            triggerRefresh();
          }
        }, 2000);
      };

      // AI Chatbot Handler
      const handleAiSend = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const userMsg = chatInput.trim();
        const newMsgs = [...aiMessages, { sender: 'user', text: userMsg }];
        setAiMessages(newMsgs);
        setChatInput('');

        // स्मार्ट AI बॉट रिस्पॉन्स लॉजिक
        setTimeout(() => {
          let botReply = "क्षमा करें, मैं पूरी तरह समझ नहीं पाया। आप रिचार्ज, विथड्रॉल या प्लान के बारे में पूछ सकते हैं।";
          const lower = userMsg.toLowerCase();

          if (lower.includes('recharge') || lower.includes('रिचार्ज') || lower.includes('paisa') || lower.includes('पैसा')) {
            botReply = "रिचार्ज करने के लिए 'रिचार्ज' टैब में जाएं, राशि और UTR भरकर स्क्रीनशॉट अपलोड करें। रात 12 बजे तक वॉलेट में पैसे जोड़ दिए जाएंगे।";
          } else if (lower.includes('withdraw') || lower.includes('विथड्रॉल') || lower.includes('nikalna')) {
            botReply = "आप अपनी कमाई हुई राशि 'विथड्रॉल करें' बटन से सीधे अपने बैंक खाते में भेज सकते हैं। बैंक डिटेल्स प्रोफाइल में सेव होनी चाहिए।";
          } else if (lower.includes('plan') || lower.includes('इन्वेस्ट') || lower.includes('invest')) {
            botReply = "₹150 का Starter Plan खरीदने पर आपको हर दिन ₹100 मिलेंगे (अवधि 49 दिन)। साथ ही आपके रेफरर को 10% कमीशन भी मिलेगा!";
          } else if (lower.includes('hello') || lower.includes('hi') || lower.includes('नमस्ते')) {
            botReply = "नमस्ते! GlowSkincare में आपका स्वागत है। आज मैं आपकी क्या सहायता कर सकता हूँ?";
          }

          setAiMessages([...newMsgs, { sender: 'ai', text: botReply }]);
        }, 800);
      };

      // --- ADMIN VIEW ---
      if (isAdminMode) {
        const pendingRecharges = getPendingRecharges();
        return (
          <div className="min-h-screen bg-gray-900 text-white p-4 font-sans max-w-md mx-auto relative shadow-2xl">
            <div className="flex justify-between items-center mb-6 bg-gray-800 p-4 rounded-2xl">
              <div>
                <h1 className="text-xl font-bold text-pink-400">🛡️ Admin Dashboard</h1>
                <p className="text-xs text-gray-400">UTR और स्क्रीनशॉट मिलान करके अप्रूव करें</p>
              </div>
              <button onClick={() => setIsAdminMode(false)} className="bg-pink-600 px-3 py-1.5 rounded-xl text-xs font-semibold">
                ऐप पर जाएं
              </button>
            </div>

            <div className="space-y-4">
              <h3 className="font-bold text-sm text-gray-300">पेंडिंग रिचार्ज अनुरोध ({pendingRecharges.length})</h3>
              {pendingRecharges.length === 0 ? (
                <div className="text-center py-12 bg-gray-800/50 rounded-2xl border border-gray-700">
                  <p className="text-gray-400 text-sm">कोई पेंडिंग रिचार्ज नहीं है।</p>
                </div>
              ) : (
                pendingRecharges.map((req) => (
                  <div key={req.id} className="bg-gray-800 p-4 rounded-2xl border border-gray-700 space-y-3">
                    <div className="flex justify-between items-start">
                      <div>
                        <p className="text-xs text-gray-400">मोबाइल: <span className="font-bold text-white">{req.phone}</span></p>
                        <p className="text-lg font-bold text-green-400 my-0.5">₹{req.amount}</p>
                      </div>
                      <span className="bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded text-[10px] font-bold">Pending</span>
                    </div>

                    <div className="bg-gray-900 p-2.5 rounded-xl border border-gray-700">
                      <p className="text-[11px] text-gray-400">UTR / Transaction ID:</p>
                      <p className="text-xs font-mono font-bold text-yellow-400 tracking-wider">{req.utr}</p>
                    </div>

                    {req.screenshot && (
                      <div className="bg-gray-900 p-2 rounded-xl border border-gray-700">
                        <p className="text-[11px] text-gray-400 mb-1">पेमेंट स्क्रीनशॉट:</p>
                        <a href={req.screenshot} target="_blank" rel="noopener noreferrer">
                          <img src={req.screenshot} alt="Payment Screenshot" className="w-full h-32 object-cover rounded-lg border border-gray-700 hover:opacity-90 transition" />
                        </a>
                      </div>
                    )}

                    <div className="flex justify-between items-center pt-1">
                      <span className="text-[10px] text-gray-500">{req.date}</span>
                      <button
                        onClick={() => handleAdminApprove(req.id)}
                        className="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-xl text-xs font-bold shadow"
                      >
                        Approve (स्वीकृत करें)
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>

            <button onClick={handleLogout} className="w-full mt-8 py-3 bg-red-600/20 text-red-400 border border-red-600/30 rounded-xl text-xs font-semibold">
              लॉग आउट (Admin)
            </button>
          </div>
        );
      }

      // --- LOGIN / REGISTER VIEW ---
      if (!currentUserPhone || !user) {
        return (
          <div className="min-h-screen bg-pink-50 flex flex-col justify-center items-center p-4">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-pink-100">
              <div className="text-center mb-8">
                <h1 className="text-3xl font-bold text-pink-600">✨ GlowSkincare ✨</h1>
                <p className="text-gray-500 text-sm mt-1">
                  {isRegistering ? 'नया अकाउंट रजिस्टर करें (OTP आवश्यक)' : 'अपने रजिस्टर्ड नंबर से लॉगिन करें'}
                </p>
              </div>

              <div className="flex bg-pink-100 p-1 rounded-xl mb-6">
                <button
                  onClick={() => setIsRegistering(false)}

            <button onClick={() => setCurrentTab('profile')} className={`flex flex-col items-center ${currentTab === 'profile' ? 'text-pink-600' : 'text-gray-400'}`}>
              <span className="text-lg">👤</span>
              <span className="text-[10px]">प्रोफाइल</span>
            </button>
          </div>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
